<text x="26" y="858" font-size="12.5" fill="#37474f">All ground symbols connect to the ESP32 GND pins (use a shared ground rail).</text>
<text x="26" y="877" font-size="12.5" fill="#37474f">Each push button connects its GPIO pin to GND. The sketch turns on the internal pull-ups.</text>
<text x="26" y="896" font-size="12.5" fill="#37474f">LED: GPIO 4 -&gt; 220 ohm resistor -&gt; LED anode, LED cathode -&gt; GND.</text>
<text x="26" y="915" font-size="12.5" fill="#37474f">Prefer an I2S microphone? Use the INMP441 diagram instead (GPIO 14, 27 and 32).</text>
