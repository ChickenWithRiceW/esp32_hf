; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip#5.5.5
board = esp32dev
framework = arduino

monitor_speed = 115200

# ESP32_HF_DEV_SKETCH enables src/main.cpp, the hardware test sketch. It is only for
# developing this library and is empty for anyone who installs the library.
build_src_flags = -DCORE_DEBUG_LEVEL=5 -DESP32_HF_DEV_SKETCH